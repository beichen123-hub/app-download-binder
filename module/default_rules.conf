# ==========================================================
# App Download Binder v3.3.0 规则配置文件
# 作者：KrisWu & Antigravity
# 路径：/data/adb/modules/app_download_binder/rules.conf
#
# 【目录层级模式 LAYOUT_MODE】
#   1 = 一级平铺：/sdcard/Download/<软件名>/
#   2 = 二级收纳：/sdcard/Download/应用下载/<软件名>/（默认推荐）
#   3 = 三级分类：/sdcard/Download/应用下载/<分类>/<软件名>/
#
# 【手动追加新 App】
# 格式（简写推荐，自动跟随上面的 LAYOUT_MODE 层级）：
#   软件名|App原目录相对路径
# 或写完整目标路径：
#   Download/应用下载/软件名|App原目录相对路径
# 保存后运行「一键扫描并重载挂载.sh」或点模块「操作 / Action」立即生效
# ==========================================================

# 目录层级模式（1=Download/<软件名>，2=Download/应用下载/<软件名>，3=Download/应用下载/<分类>/<软件名>）
LAYOUT_MODE=2

# 是否开启定时自动检测新 App（1=开启，0=关闭）
AUTO_SCAN=1

# 自动检测间隔（单位：小时，默认 24 小时 = 每天一次）
SCAN_INTERVAL_HOURS=24

# ==================== 手动规则（可随时手动追加） ====================
# 微信
微信|Android/data/com.tencent.mm/MicroMsg/Download
微信|Pictures/WeiXin
微信|Download/WeiXin

# QQ
QQ|Android/data/com.tencent.mobileqq/Tencent/QQfile_recv
QQ|Download/QQ

# 企业微信（filecache/<账号ID> 也会在扫描时自动识别归入）
企业微信|DCIM/WeiXinWork
企业微信|Android/data/com.tencent.wework/files/download

# Telegram（仅映射下载的文件内容，不含聊天缓存与缩略图）
Telegram|Android/data/org.telegram.messenger/files/Telegram/Telegram Files
Telegram|Android/data/org.telegram.messenger/files/Telegram/Telegram Documents
Telegram|Android/data/org.telegram.messenger.web/files/Telegram/Telegram Files
Telegram|Android/data/org.telegram.messenger.web/files/Telegram/Telegram Documents
Telegram|Download/Telegram

# ==================== 自动发现规则（同步自内置规则库 + 每日扫描） ====================
