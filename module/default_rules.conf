# ==========================================================
# App Download Binder v3.0.0 规则配置文件
# 作者：KrisWu & Antigravity
# 路径：/data/adb/modules/app_download_binder/rules.conf
#
# 【参考与引用】
# - 规则库：Kindness-Net/storage-redirection-x-rules
#           (上游 RikkaApps/StorageRedirect-assets)
# - 思路参考：Kindness-Kismet/storage-redirection-x & Third_Party_Redirect
#
# 【特点：一软件一文件夹】
# - 统一归类到 /sdcard/Download/应用下载/<软件名>
# - 同一个软件的多条路径直接写相同的左边目录，脚本自动合并归拢
# - 采用 mount --bind 底层映射，不复制、不双重占用存储空间
#
# 【手动追加新 App】
# 格式：Download/应用下载/软件名|App原目录相对路径
# 保存后运行「3-立即重载rules配置.sh」或点模块「操作 / Action」立即生效
# ==========================================================

# 是否开启定时自动检测新 App（1=开启，0=关闭）
AUTO_SCAN=1

# 自动检测间隔（单位：小时，默认 24 小时 = 每天一次）
SCAN_INTERVAL_HOURS=24

# ==================== 手动规则（可随时手动追加） ====================
# 微信（聊天文件 + 保存文件 + 照片视频，全部归拢到 Download/应用下载/微信）
Download/应用下载/微信|Android/data/com.tencent.mm/MicroMsg/Download
Download/应用下载/微信|Pictures/WeiXin
Download/应用下载/微信|Download/WeiXin

# QQ
Download/应用下载/QQ|Android/data/com.tencent.mobileqq/Tencent/QQfile_recv
Download/应用下载/QQ|Download/QQ

# 企业微信（照片视频 + 下载目录；filecache/<账号ID> 也会自动识别归入）
Download/应用下载/企业微信|DCIM/WeiXinWork
Download/应用下载/企业微信|Android/data/com.tencent.wework/files/download

# Telegram（仅映射下载的文件内容，不含聊天缓存与缩略图）
Download/应用下载/Telegram|Android/data/org.telegram.messenger/files/Telegram/Telegram Files
Download/应用下载/Telegram|Android/data/org.telegram.messenger/files/Telegram/Telegram Documents
Download/应用下载/Telegram|Android/data/org.telegram.messenger.web/files/Telegram/Telegram Files
Download/应用下载/Telegram|Android/data/org.telegram.messenger.web/files/Telegram/Telegram Documents
Download/应用下载/Telegram|Download/Telegram

# ==================== 自动发现规则（同步自内置规则库 + 每日扫描） ====================
